name: build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch / tag when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Unit tests + vet on every push / PR. Required for the build job to run.
  # ---------------------------------------------------------------------------
  test:
    name: vet / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: go vet
        run: go vet ./...

      - name: go test (with race detector)
        run: go test -race ./... -count=1

  # ---------------------------------------------------------------------------
  # Cross-compile static binary for the only supported target: linux/amd64.
  # Reads VERSION from the Makefile so the build directory layout and the
  # injected -X ssl-update/internal/cli.Version ldflag stay in sync.
  # ---------------------------------------------------------------------------
  build:
    name: build linux-amd64
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: extract VERSION from Makefile
        id: meta
        run: |
          VERSION=$(grep -E '^VERSION\s*:=' Makefile | awk '{print $3}')
          if [ -z "$VERSION" ]; then
            echo "::error::could not parse VERSION from Makefile" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: build linux-amd64
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          OUT="pkg/ssl-update-${VERSION}-linux-amd64"
          mkdir -p "$OUT"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath \
              -ldflags="-s -w -buildid= -X ssl-update/internal/cli.Version=${VERSION}" \
              -o "${OUT}/ssl-update" \
              ./cmd/ssl-update
          ( cd "$OUT" && sha256sum ssl-update > sha256sum.txt )
          ls -la "$OUT"

      - name: verify ELF + static linkage
        run: |
          BIN="pkg/ssl-update-${{ steps.meta.outputs.version }}-linux-amd64/ssl-update"
          file "$BIN"
          # Must be statically linked (CGO_ENABLED=0)
          if ldd "$BIN" 2>&1 | grep -q 'not a dynamic executable'; then
            echo "OK: statically linked"
          else
            echo "WARN: ldd output:"
            ldd "$BIN" || true
          fi

      - uses: actions/upload-artifact@v3
        with:
          name: ssl-update-linux-amd64
          path: pkg/ssl-update-${{ steps.meta.outputs.version }}-linux-amd64/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Smoke-test the built binary: structural checks (file/ldd), config
  # validation, error strategies, CLI flag wiring. No external services —
  # all targets point at 127.0.0.1:1.
  # ---------------------------------------------------------------------------
  smoke-test:
    name: smoke test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: download binary
        uses: actions/download-artifact@v3
        with:
          name: ssl-update-linux-amd64
          path: bin

      - name: chmod +x (artifact download sometimes drops the executable bit)
        run: chmod +x bin/ssl-update

      - name: install prereqs for smoke-test.sh
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl python3

      - name: run smoke tests
        run: |
          BIN="$GITHUB_WORKSPACE/bin/ssl-update"
          if [ ! -x "$BIN" ]; then
            echo "FATAL: $BIN not executable"
            ls -la "$GITHUB_WORKSPACE/bin/"
            exit 1
          fi
          echo "Testing: $BIN"
          echo "=========================================="
          BIN="$BIN" bash scripts/smoke-test.sh

  # ---------------------------------------------------------------------------
  # On tag push (vX.Y.Z), gather all build artifacts and create a Gitea
  # release with the binaries and sha256 sums attached.
  #
  # Replaces softprops/action-gh-release because that action calls
  # GitHub-only endpoints (POST /releases/generate-notes → 405 on Gitea)
  # even when the rest of the API is compatible.
  # ---------------------------------------------------------------------------
  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so we can compute release notes from commits
          # between the previous tag and this one.
          fetch-depth: 0

      - name: download all build artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: list downloaded artifacts
        run: find artifacts -type f | sort

      # Rewrite each sha256sum.txt so its entries reference the binary's
      # final upload name (ssl-update-<ver>-<plat>) instead of the bare
      # "ssl-update". This way `sha256sum -c <file>.sha256sum` works
      # after the user downloads both files together. The release notes
      # below pick up the rewritten content automatically.
      - name: rewrite checksum entries to match upload names
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for file in $(find artifacts -type f -name sha256sum.txt); do
            case "$file" in
              *linux-amd64*) PLAT="linux-amd64" ;;
              *) echo "skip: $file"; continue ;;
            esac
            NEWBIN="ssl-update-${TAG}-${PLAT}"
            sed -i "s/  ssl-update$/  ${NEWBIN}/" "$file"
            echo "  $file → references ${NEWBIN}"
          done

      - name: generate release notes from commit log
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          # Find the most recent stable tag (vX.Y.Z, no -suffix) before this one.
          PREV_TAG=$(git tag --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -v "^${TAG}$" \
            | head -1 || true)
          {
            echo "## ${TAG}"
            echo ""
            if [ -z "$PREV_TAG" ]; then
              echo "Initial release."
            else
              echo "Changes since ${PREV_TAG}:"
              echo ""
              git log --no-merges --pretty=format:"- %s (%h)" "${PREV_TAG}..${TAG}"
              echo ""
            fi
            echo ""
            echo "## Checksums"
            echo ""
            echo '```'
            find artifacts -type f -name sha256sum.txt -exec cat {} \;
            echo '```'
          } > /tmp/release-notes.md
          echo "Wrote $(wc -l < /tmp/release-notes.md) lines to /tmp/release-notes.md"

      - name: create release and upload assets via Gitea API
        env:
          API: ${{ github.server_url }}/api/v1
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 1. Create the release (POST /api/v1/repos/{owner}/{repo}/releases).
          #    prerelease is auto-detected from the tag name per semver:
          #    vX.Y.Z       → stable
          #    vX.Y.Z-rc1   → pre-release
          PRERELEASE="false"
          case "$TAG" in
            *-*) PRERELEASE="true" ;;
          esac

          echo "Creating release for $TAG (prerelease=$PRERELEASE)..."
          RESP=$(curl -fsS -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg tag "$TAG" \
              --arg name "$TAG" \
              --rawfile body /tmp/release-notes.md \
              --argjson prerelease "$PRERELEASE" \
              '{tag_name:$tag, name:$name, body:$body, prerelease:$prerelease}')" \
            "$API/repos/$REPO/releases")
          RELEASE_ID=$(echo "$RESP" | jq -r '.id')
          echo "Created release id=$RELEASE_ID"
          echo "URL: ${{ github.server_url }}/$REPO/releases/tag/$TAG"

          # 2. Upload each artifact as a release asset with a name that
          #    encodes the version + platform. Matches the filename
          #    references rewritten into sha256sum.txt above, keeping
          #    `sha256sum -c` usable after download.
          for file in $(find artifacts -type f); do
            case "$file" in
              *linux-amd64*) PLAT="linux-amd64" ;;
              *) echo "skip: $file"; continue ;;
            esac
            BASENAME="$(basename "$file")"
            case "$BASENAME" in
              ssl-update)
                NAME="ssl-update-${TAG}-${PLAT}"
                ;;
              sha256sum.txt)
                NAME="ssl-update-${TAG}-${PLAT}.sha256sum"
                ;;
              *)
                NAME="${BASENAME}-${PLAT}"
                ;;
            esac
            echo "Uploading $NAME ..."
            curl -fsS -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -F "attachment=@${file}" \
              "$API/repos/$REPO/releases/$RELEASE_ID/assets?name=$NAME" \
              > /dev/null
          done
          echo "Done."
