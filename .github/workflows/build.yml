name: build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch / tag when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Unit tests + vet on every push / PR. Required for the build job to run.
  # ---------------------------------------------------------------------------
  test:
    name: vet / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: go vet
        run: go vet ./...

      - name: go test (with race detector)
        run: go test -race ./... -count=1

  # ---------------------------------------------------------------------------
  # Cross-compile static binary for the only supported target: linux/amd64.
  # Reads VERSION from the Makefile so the build directory layout and the
  # injected -X ssl-update/internal/cli.Version ldflag stay in sync.
  # ---------------------------------------------------------------------------
  build:
    name: build linux-amd64
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: extract VERSION from Makefile
        id: meta
        run: |
          VERSION=$(grep -E '^VERSION\s*:=' Makefile | awk '{print $3}')
          if [ -z "$VERSION" ]; then
            echo "::error::could not parse VERSION from Makefile" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: build linux-amd64
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          OUT="pkg/ssl-update-${VERSION}-linux-amd64"
          mkdir -p "$OUT"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath \
              -ldflags="-s -w -buildid= -X ssl-update/internal/cli.Version=${VERSION}" \
              -o "${OUT}/ssl-update" \
              ./cmd/ssl-update
          ( cd "$OUT" && sha256sum ssl-update > sha256sum.txt )
          ls -la "$OUT"

      - name: verify ELF + static linkage
        run: |
          BIN="pkg/ssl-update-${{ steps.meta.outputs.version }}-linux-amd64/ssl-update"
          file "$BIN"
          # Must be statically linked (CGO_ENABLED=0)
          if ldd "$BIN" 2>&1 | grep -q 'not a dynamic executable'; then
            echo "OK: statically linked"
          else
            echo "WARN: ldd output:"
            ldd "$BIN" || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ssl-update-linux-amd64
          path: pkg/ssl-update-${{ steps.meta.outputs.version }}-linux-amd64/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Smoke-test the built binary: structural checks (file/ldd), config
  # validation, error strategies, CLI flag wiring. No external services —
  # all targets point at 127.0.0.1:1.
  # ---------------------------------------------------------------------------
  smoke-test:
    name: smoke test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: download binary
        uses: actions/download-artifact@v4
        with:
          name: ssl-update-linux-amd64
          path: bin

      - name: chmod +x (artifact download sometimes drops the executable bit)
        run: chmod +x bin/ssl-update

      - name: install prereqs for smoke-test.sh
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl python3

      - name: run smoke tests
        run: |
          BIN="$GITHUB_WORKSPACE/bin/ssl-update"
          if [ ! -x "$BIN" ]; then
            echo "FATAL: $BIN not executable"
            ls -la "$GITHUB_WORKSPACE/bin/"
            exit 1
          fi
          echo "Testing: $BIN"
          echo "=========================================="
          BIN="$BIN" bash scripts/smoke-test.sh

  # ---------------------------------------------------------------------------
  # On tag push (vX.Y.Z), gather all build artifacts and create a GitHub
  # release with the binaries and sha256 sums attached.
  #
  # Uses softprops/action-gh-release@v2 (no longer blocked by the Gitea
  # /releases/generate-notes 405 that forced us off it the first time).
  # Asset names keep the ssl-update-${TAG}-${PLAT} convention used by
  # v0.1.3 / v0.1.4 so existing `sha256sum -c` workflows still work.
  # ---------------------------------------------------------------------------
  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so we can compute release notes from commits
          # between the previous tag and this one.
          fetch-depth: 0

      - name: download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: list downloaded artifacts
        run: find artifacts -type f | sort

      # Copy each artifact into ./stage/ with the final upload name
      # (ssl-update-<TAG>-<PLAT> for binaries, ssl-update-<TAG>-<PLAT>.sha256sum
      # for checksums). action-gh-release uploads with the basename of each
      # matched file, so staging with the right names is how we keep the
      # version+platform in the asset name.
      - name: stage release assets with version+platform names
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          STAGE="stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          for file in $(find artifacts -type f); do
            case "$file" in
              *linux-amd64*) PLAT="linux-amd64" ;;
              *) echo "skip: $file"; continue ;;
            esac
            BASENAME="$(basename "$file")"
            case "$BASENAME" in
              ssl-update)
                NAME="ssl-update-${TAG}-${PLAT}"
                ;;
              sha256sum.txt)
                NAME="ssl-update-${TAG}-${PLAT}.sha256sum"
                ;;
              *)
                NAME="${BASENAME}-${PLAT}"
                ;;
            esac
            cp "$file" "$STAGE/$NAME"
            echo "  $file → $STAGE/$NAME"
          done
          echo "Staged:"
          ls -la "$STAGE"

      # Rewrite each .sha256sum so its entry references the binary's final
      # upload name (ssl-update-<ver>-<plat>) instead of the bare
      # "ssl-update". This way `sha256sum -c <file>.sha256sum` works after
      # the user downloads both files together.
      - name: rewrite checksum entries to match upload names
        run: |
          set -euo pipefail
          for file in $(find stage -type f -name '*.sha256sum'); do
            NEWBIN="$(basename "$file" .sha256sum)"
            sed -i "s/  ssl-update$/  ${NEWBIN}/" "$file"
            echo "  $file → references ${NEWBIN}"
          done

      - name: generate release notes from commit log
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          # Find the most recent stable tag (vX.Y.Z, no -suffix) before this one.
          PREV_TAG=$(git tag --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -v "^${TAG}$" \
            | head -1 || true)
          {
            echo "## ${TAG}"
            echo ""
            if [ -z "$PREV_TAG" ]; then
              echo "Initial release."
            else
              echo "Changes since ${PREV_TAG}:"
              echo ""
              git log --no-merges --pretty=format:"- %s (%h)" "${PREV_TAG}..${TAG}"
              echo ""
            fi
            echo ""
            echo "## Checksums"
            echo ""
            echo '```'
            find stage -type f -name '*.sha256sum' -exec cat {} \;
            echo '```'
          } > /tmp/release-notes.md
          echo "Wrote $(wc -l < /tmp/release-notes.md) lines to /tmp/release-notes.md"

      - name: create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_file: /tmp/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            stage/*