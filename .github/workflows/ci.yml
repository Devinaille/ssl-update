name: CI

# Integration gate for the mainline. `dev` builds/tests run in dev.yml;
# RC/release packaging runs in release.yml on tags cut from main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

# Cancel in-progress runs for the same branch / PR when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Format / vet / unit tests. Required for the build job to run.
  # ---------------------------------------------------------------------------
  test:
    name: gofmt / vet / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'

      - name: gofmt
        run: |
          drift=$(gofmt -l .)
          if [ -n "$drift" ]; then
            echo "::error::gofmt drift in:"; echo "$drift"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (with race detector)
        run: go test -race ./... -count=1

  # ---------------------------------------------------------------------------
  # Cross-compile static binary for the only supported target: linux/amd64.
  # Reads VERSION from the Makefile so the build directory layout and the
  # injected -X ssl-update/internal/cli.Version ldflag stay in sync.
  # ---------------------------------------------------------------------------
  build:
    name: build linux-amd64
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'

      - name: extract VERSION from Makefile
        id: meta
        run: |
          VERSION=$(grep -E '^VERSION\s*:=' Makefile | awk '{print $3}')
          if [ -z "$VERSION" ]; then
            echo "::error::could not parse VERSION from Makefile" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: build linux-amd64
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          OUT="pkg/ssl-update-${VERSION}-linux-amd64"
          mkdir -p "$OUT"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath \
              -ldflags="-s -w -buildid= -X ssl-update/internal/cli.Version=${VERSION}" \
              -o "${OUT}/ssl-update" \
              ./cmd/ssl-update
          ( cd "$OUT" && sha256sum ssl-update > sha256sum.txt )
          ls -la "$OUT"

      - name: verify ELF + static linkage
        run: |
          BIN="pkg/ssl-update-${{ steps.meta.outputs.version }}-linux-amd64/ssl-update"
          file "$BIN"
          if ldd "$BIN" 2>&1 | grep -q 'not a dynamic executable'; then
            echo "OK: statically linked"
          else
            echo "WARN: ldd output:"
            ldd "$BIN" || true
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ssl-update-linux-amd64
          path: pkg/ssl-update-${{ steps.meta.outputs.version }}-linux-amd64/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Smoke-test the built binary: structural checks, config validation, error
  # strategies, CLI flag wiring. No external services — all targets point at
  # 127.0.0.1:1.
  # ---------------------------------------------------------------------------
  smoke-test:
    name: smoke test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: download binary
        uses: actions/download-artifact@v8
        with:
          name: ssl-update-linux-amd64
          path: bin

      - name: chmod +x (artifact download sometimes drops the executable bit)
        run: chmod +x bin/ssl-update

      - name: install prereqs for smoke-test.sh
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl python3

      - name: run smoke tests
        run: |
          BIN="$GITHUB_WORKSPACE/bin/ssl-update"
          if [ ! -x "$BIN" ]; then
            echo "FATAL: $BIN not executable"
            ls -la "$GITHUB_WORKSPACE/bin/"
            exit 1
          fi
          echo "Testing: $BIN"
          echo "=========================================="
          BIN="$BIN" bash scripts/smoke-test.sh
